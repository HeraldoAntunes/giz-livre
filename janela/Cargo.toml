# Giz Livre — © 2026 Heraldo Antunes — Licença MIT (ver LICENSE). Janela própria (P60): Tauri 2 com o WebView2
[package]
name = "giz-livre-janela"
version = "1.16.1"
description = "Giz Livre: lousa digital livre, na janela própria do programa"
authors = ["Heraldo Antunes"]
edition = "2021"
license = "MIT"

[[bin]]
name = "GizLivre"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# sem a "compression" (brotli) do padrão: no Bancada, com ela o exe levava 1 alerta de 75 no VirusTotal (Trapmine,
# 29/10/2026) e sem ela, 0. A feature compressao abaixo só existe para montar a variante de comparação.
# custom-protocol: o modo de produção do Tauri (o "tauri build" o liga sozinho; aqui o build é o cargo puro). Sem ele,
# o exe sai como build de desenvolvimento e leva dentro o caminho da pasta do projeto neste PC.
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "custom-protocol"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[features]
compressao = ["tauri/compression"]
so-janela = []   # sem o código de instalar (só para comparar no VirusTotal)
# variantes da rodada 4 do VirusTotal (29/10/2026), para achar o que o aprendizado de máquina dos antivírus estranha
minimo = []
sem-filho = []
sem-local-state = []
sem-instancia-unica = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
