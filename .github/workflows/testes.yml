# Testes automáticos a cada envio ao GitHub: os da página (Node), os do servidor (Python) e o de ponta a ponta
# (servidor, MCP e Microsoft Edge sem janela). Roda no Windows, o sistema em que o programa é testado.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Sintaxe dos arquivos JavaScript
        shell: pwsh
        run: Get-ChildItem app/js -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit 1 } }

      - name: Testes da página
        run: node tests/testes.mjs

      - name: Testes do servidor
        run: python -m unittest tests/test_server.py -v

      - name: Teste de ponta a ponta (servidor, MCP e Edge sem janela)
        run: node tests/e2e_agente.mjs
