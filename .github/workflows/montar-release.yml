# Monta os zips da janela própria em uma máquina descartável do GitHub. Não publica.
name: Montar release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag ou branch a montar"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: montar-${{ inputs.ref }}

jobs:
  montar:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Testar e compilar a janela com o Cargo.lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIZ_PACOTE = ''
          $env:TAURI_CONFIG = '{"bundle":{"publisher":null},"build":{"frontendDist":"../app"}}'
          $env:CARGO_ENCODED_RUSTFLAGS = "--remap-path-prefix=$env:USERPROFILE=~" + [char]31 + "--remap-path-prefix=$env:GITHUB_WORKSPACE=."
          cargo test --locked --release --manifest-path janela/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release --manifest-path janela/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Montar os zips com o executável compilado, sem recompilar
        shell: pwsh
        run: |
          python scripts/montar_janela.py --exe janela/target/release/GizLivre.exe
          exit $LASTEXITCODE

      - name: Conferir o servidor no Python embutido do pacote
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (Get-Content janela/tauri.conf.json -Raw | ConvertFrom-Json).version
          $zip = "dist/janela/GizLivre-$v-portatil.zip"
          $pasta = Join-Path $env:RUNNER_TEMP 'giz-portatil'
          Expand-Archive -LiteralPath $zip -DestinationPath $pasta
          $prog = Join-Path $pasta 'GizLivre'
          $dados = Join-Path $env:RUNNER_TEMP 'giz-dados-teste'
          $env:GIZ_LIVRE_JANELA = '1'
          $env:GIZ_LIVRE_PASTA = $prog
          $argumentos = @(('"{0}"' -f (Join-Path $prog 'servidor/server.py')), '--sem-janela', '--porta', '8790', '--dados', ('"{0}"' -f $dados))
          $p = Start-Process (Join-Path $prog 'python/pythonw.exe') -ArgumentList $argumentos -WindowStyle Hidden -PassThru
          try {
            $info = $null
            $conexao = $null
            foreach ($i in 1..60) {
              try {
                $conexao = Get-Content (Join-Path $dados '.agente/conexao.json') -Raw -ErrorAction Stop | ConvertFrom-Json
                if ($conexao.pid -ne $p.Id) { throw 'conexão de outro processo' }
                $info = Invoke-RestMethod "http://127.0.0.1:$($conexao.porta)/api/info" -Headers @{ 'X-Lousa' = $conexao.token } -TimeoutSec 2
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $info) { throw 'o servidor do pacote não respondeu' }
            if ($info.versao -ne $v) { throw "versão $($info.versao), esperada $v" }
            Invoke-RestMethod "http://127.0.0.1:$($conexao.porta)/api/sair" -Method Post -Headers @{ 'X-Lousa' = $conexao.token } -ContentType 'application/json' -Body '{}' | Out-Null
            if (-not $p.WaitForExit(10000)) { throw 'o servidor do pacote não encerrou' }
            "Servidor do pacote respondeu na versão $v; este passo não homologa a janela."
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Remove-Item Env:GIZ_LIVRE_JANELA, Env:GIZ_LIVRE_PASTA -ErrorAction SilentlyContinue
          }

      - name: Guardar somente os zips e as somas
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: giz-livre-${{ github.run_number }}
          path: |
            dist/janela/Instalar-GizLivre-*.zip
            dist/janela/GizLivre-*-portatil.zip
            dist/janela/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
