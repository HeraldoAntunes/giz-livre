name: Relatar um problema
description: Algo não funcionou como deveria no Giz Livre
labels: ["problema"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a melhorar o Giz Livre! Problemas de **segurança** não devem ser abertos aqui: veja o SECURITY.md.
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passo a passo para repetir
      placeholder: |
        1. Abri um caderno A4
        2. Escolhi a caneta 2
        3. ...
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do Giz Livre
      description: Está em "Sobre", no canto superior direito da galeria.
      placeholder: "1.0.1"
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema
      options: [Windows 11, Windows 10, Linux, macOS, Outro]
    validations:
      required: true
  - type: dropdown
    id: entrada
    attributes:
      label: Com o que você estava escrevendo?
      options: [Mesa digitalizadora sem tela (ex. Wacom Intuos), Tela com caneta (ex. Wacom One/Cintiq, Surface), Toque com o dedo, Mouse]
  - type: input
    id: mesa
    attributes:
      label: Modelo da mesa digitalizadora (se houver)
      placeholder: "Wacom Intuos S"
  - type: textarea
    id: extra
    attributes:
      label: Prints ou observações
      description: Arraste imagens para cá. Não envie quadros com dados pessoais de alunos.
