# Dependabot: uma vez por mês, abre um pedido de mudança (pull request) quando sai versão nova das actions
# ou das dependências de build do instalador. Nada é aplicado sozinho: cada pedido só entra se for aceito.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /installer
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
